<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles/main.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
    <link rel="alternate icon" href="/public/favicon.ico" />
  </head>
  <body>
    <main class="min-h-screen flex items-center justify-center">
      <article class="mx-auto max-w-[720px] px-6 py-12 text-center">
        <h1 class="text-[38px] leading-[42px] font-normal tracking-tight mb-8">
          404 - Page Not Found
        </h1>
        <p class="mb-6">The page you're looking for doesn't exist.</p>
        <a
          href="/"
          class="inline-block px-6 py-3 bg-primary text-primary-foreground rounded-lg hover:opacity-90 transition-opacity no-underline"
        >
          Go back home
        </a>
      </article>
    </main>
  </body>
</html>
